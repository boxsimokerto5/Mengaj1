name: Build Android APK and AAB (SRT 1 Kediri Mengaji)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Restore Permanent Release Keystore
        run: |
          if [ -f my-upload-key.jks ]; then
            echo "Keystore my-upload-key.jks already present"
          elif [ -f my-upload-key.jks.base64 ]; then
            echo "Restoring my-upload-key.jks from base64"
            base64 -d my-upload-key.jks.base64 > my-upload-key.jks
          elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring my-upload-key.jks from GitHub Secrets"
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
          else
            echo "Error: Release keystore not found"
            exit 1
          fi
          ls -la my-upload-key.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'srt1kediri2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'srt1kediri2026' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB (Google Play Bundle)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'srt1kediri2026' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'srt1kediri2026' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Debug APK (Optional for Quick Testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
