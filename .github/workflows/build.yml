name: Build Android APK and AAB (SRT 1 Kediri Mengaji)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Setup Keystore and Signing Credentials
        run: |
          # 1. Ensure .env file exists so secrets gradle plugin does not complain
          touch .env
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          fi

          # 2. Restore keystore if missing from base64
          if [ ! -f my-upload-key.jks ]; then
            if [ -f my-upload-key.jks.base64 ]; then
              echo "Restoring my-upload-key.jks from repository base64 file..."
              base64 -d my-upload-key.jks.base64 > my-upload-key.jks
            elif [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
              echo "Restoring my-upload-key.jks from GitHub Secrets..."
              echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            else
              echo "Error: Keystore file my-upload-key.jks not found!"
              exit 1
            fi
          fi

          # 3. Resolve passwords safely in bash (avoids GitHub Actions ${{ a || b }} boolean evaluation)
          STORE_PASS="${{ secrets.STORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="srt1kediri2026"
          fi

          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="srt1kediri2026"
          fi

          # 4. Verify keystore credentials before running Gradle
          echo "Verifying keystore credentials with keytool..."
          keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASS" -alias upload > /dev/null
          echo "Keystore verified successfully for alias 'upload'!"

          # 5. Export variables to GITHUB_ENV so all subsequent steps have them
          echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB (Google Play Bundle)
        run: ./gradlew bundleRelease --stacktrace

      - name: Build Debug APK (Optional for Quick Testing)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SRT1Kediri-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
